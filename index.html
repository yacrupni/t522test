<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><title>SAT to TAP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#252b29;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,420px);margin:auto;min-height:100svh;padding: max(28px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:28px}header{text-align:center}h1{font-size:24px;letter-spacing:2px;margin:0 0 12px}p{font-size:16px;line-height:1.5;margin:0;color:#626963}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #286753;outline-offset:4px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{height:100px;border:2px solid #dedfd8;border-radius:18px;background:#fff;font-size:44px;font-weight:650;box-shadow:0 5px 0 #dedfd8;transition:transform .15s,border-color .15s,background .15s}.tile[aria-pressed=true]{border-color:#347b60;background:#e4f0e8;transform:translateY(-4px);box-shadow:0 7px 0 #c0d6c7}.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.letter{height:60px;border:1px solid #d8dcd4;background:#e9ece5;border-radius:12px;font-size:24px;font-weight:600;box-shadow:0 3px 0 #d8dcd4}.letter:active,.tile:active{transform:translateY(2px);box-shadow:none}button:disabled{cursor:default;opacity:.45}.message{min-height:48px;text-align:center;color:#47564e}.path{min-height:44px;text-align:center;line-height:1.9;font-size:14px;color:#747b75;overflow-wrap:anywhere}.path strong{color:#286753}.controls{display:flex;justify-content:center;gap:20px}.control{border:0;background:transparent;padding:12px;font-size:15px;text-decoration:underline;text-underline-offset:4px}.win .tile{background:#d4ead9;border-color:#347b60;box-shadow:0 5px 0 #aecab6;animation:pop .35s ease}.win .tile:nth-child(2){animation-delay:.07s}.win .tile:nth-child(3){animation-delay:.14s}@keyframes pop{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-height:650px){main{gap:18px}.tile{height:84px}}
</style></head><body><main>
<header><h1>SAT → TAP</h1><p>Change one letter at a time.<br>Make a real word with every move.</p></header>
<div class="board" aria-label="Current word"></div>
<p class="message" role="status" aria-live="polite">Tap a tile, then choose a new letter.</p>
<div class="bank" aria-label="Replacement letters"></div>
<div class="path" aria-label="Your word path"></div>
<div class="controls"><button class="control" id="undo">Undo</button><button class="control" id="restart">Restart</button></div>
</main><script>
const words=new Set(['SAT','SIT','SIP','TIP','TAP','SAP','PAT','PIT','PIP','SIS','TAT']);
let history=['SAT'],selected=null;
const board=document.querySelector('.board'),bank=document.querySelector('.bank'),message=document.querySelector('.message'),path=document.querySelector('.path');
function render(note){const word=history.at(-1),won=word==='TAP';board.classList.toggle('win',won);board.replaceChildren();
[...word].forEach((letter,index)=>{const b=document.createElement('button');b.className='tile';b.textContent=letter;b.setAttribute('aria-label',`Letter ${index+1}: ${letter}`);b.setAttribute('aria-pressed',String(selected===index));b.disabled=won;b.onclick=()=>{selected=index;render(`Choose a letter to replace ${letter}.`);bank.children[0].focus({preventScroll:true});};board.append(b);});
bank.replaceChildren();[...'AIPST'].forEach(letter=>{const b=document.createElement('button');b.className='letter';b.textContent=letter;b.setAttribute('aria-label',`Use ${letter}`);b.disabled=won;b.onclick=()=>{if(selected===null){message.textContent='First, tap the tile you want to change.';return}const next=[...word];next[selected]=letter;const candidate=next.join('');if(candidate===word){message.textContent='Choose a different letter.';return}if(!words.has(candidate)){message.textContent=`${candidate} isn’t a word for this level. Try another letter.`;return}history.push(candidate);selected=null;render();if(candidate!=='TAP')board.children[0].focus({preventScroll:true});};bank.append(b);});
path.replaceChildren();history.forEach((w,i)=>{if(i)path.append(' → ');const span=document.createElement(i===history.length-1?'strong':'span');span.textContent=w;path.append(span);});
message.textContent=won?`You made it! ${history.length-1} moves.`:note||'Tap a tile, then choose a new letter.';document.querySelector('#undo').disabled=history.length===1;}
document.querySelector('#undo').onclick=()=>{if(history.length>1)history.pop();selected=null;render()};document.querySelector('#restart').onclick=()=>{history=['SAT'];selected=null;render()};render();
</script></body></html>
