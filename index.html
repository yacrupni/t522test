<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><title>Word Tiles</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#252b29;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,420px);margin:auto;min-height:100svh;padding: max(28px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:28px}header{text-align:center}h1{font-size:24px;letter-spacing:2px;margin:0 0 12px}p{font-size:16px;line-height:1.5;margin:0;color:#626963}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #286753;outline-offset:4px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{height:100px;border:2px solid #dedfd8;border-radius:18px;background:#fff;font-size:44px;font-weight:650;box-shadow:0 5px 0 #dedfd8;transition:transform .15s,border-color .15s,background .15s}.tile[aria-pressed=true]{border-color:#347b60;background:#e4f0e8;transform:translateY(-4px);box-shadow:0 7px 0 #c0d6c7}.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.letter{height:60px;border:1px solid #d8dcd4;background:#e9ece5;border-radius:12px;font-size:24px;font-weight:600;box-shadow:0 3px 0 #d8dcd4}.letter:active,.tile:active{transform:translateY(2px);box-shadow:none}button:disabled{cursor:default;opacity:.45}.message{min-height:48px;text-align:center;color:#47564e}.path{min-height:44px;text-align:center;line-height:1.9;font-size:14px;color:#747b75;overflow-wrap:anywhere}.path strong{color:#286753}.controls{display:flex;justify-content:center;gap:20px}.control{border:0;background:transparent;padding:12px;font-size:15px;text-decoration:underline;text-underline-offset:4px}.win .tile{background:#d4ead9;border-color:#347b60;box-shadow:0 5px 0 #aecab6;animation:pop .35s ease}.win .tile:nth-child(2){animation-delay:.07s}.win .tile:nth-child(3){animation-delay:.14s}@keyframes pop{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-height:650px){main{gap:18px}.tile{height:84px}}

[hidden]{display:none!important}.screen{display:flex;flex-direction:column;gap:24px}.primary{border:0;border-radius:14px;background:#347b60;color:white;padding:17px 24px;font-weight:650;font-size:18px;min-height:56px}.secondary{border:1px solid #ccd4ca;background:white;border-radius:14px;padding:16px;font-size:17px}.eyebrow{text-align:center;font-size:14px;color:#68776c;margin-bottom:12px}.four .tile{height:80px;font-size:35px}.finish{display:grid;gap:10px}.welcome-tiles{display:flex;justify-content:center;gap:8px}.welcome-tiles span{padding:16px;background:#e4f0e8;border-radius:12px;font-size:28px;font-weight:650}.bank{grid-template-columns:repeat(4,1fr)}.bank.five{grid-template-columns:repeat(5,1fr)}
</style></head><body><main>
<section id="welcome" class="screen"><header><h1>Word Tiles</h1><p>Three little word puzzles.</p></header><div class="welcome-tiles" aria-hidden="true"><span>S</span><span>A</span><span>T</span></div><p style="text-align:center">Change one letter at a time.<br>Make a word with every move.</p><button class="primary" id="play">Play</button></section>
<section id="game" class="screen" hidden><header><div class="eyebrow" id="level"></div><h1 id="goal"></h1><p>Change one letter. Make a new word.</p></header><div class="board" aria-label="Current word"></div><p class="message" role="status" aria-live="polite"></p><div class="bank" aria-label="Replacement letters"></div><div class="path" aria-label="Your word path"></div><div class="controls" id="during"><button class="control" id="undo">Undo</button><button class="control" id="restart">Restart</button><button class="control" id="quit">Quit</button></div><div class="finish" hidden><button class="primary" id="next">Next level</button><button class="secondary" id="again">Play again</button><button class="control" id="finish-quit">Quit</button></div></section>
</main><script>
const levels=[
{start:'SAT',goal:'TAP',letters:'AIPST',words:'SAT SIT SIP TIP TAP SAP PAT PIT PIP SIS TAT'},
{start:'COLD',goal:'WARM',letters:'ACDLMORW',words:'COLD CORD CARD WARD WARM WORD WORM FORM FARM HARD HARM SOLD TOLD LORD LOAD ROAD ROAM'},
{start:'HEAD',goal:'TAIL',letters:'ADEHILRT',words:'HEAD HEAL TEAL TELL TALL TAIL HEAT HEEL HELL TEAR REAL REEL DEAR DEAL DIAL HAIL HALL HILL TILE TIDE TIED RAIL RAID READ LEAD LARD HARD HARE RATE LATE DATE DARE TIRE'}
];
let levelIndex=0,history=[],selected=null;
const $=s=>document.querySelector(s),board=$('.board'),bank=$('.bank'),message=$('.message'),path=$('.path');
function start(i){levelIndex=i;history=[levels[i].start];selected=null;$('#welcome').hidden=true;$('#game').hidden=false;render()}
function quit(){$('#game').hidden=true;$('#welcome').hidden=false;$('#play').focus({preventScroll:true})}
function render(note){const level=levels[levelIndex],word=history.at(-1),won=word===level.goal;
$('#level').textContent=`Level ${levelIndex+1} of 3`;$('#goal').textContent=`${level.start} → ${level.goal}`;
board.style.gridTemplateColumns=`repeat(${word.length},1fr)`;board.classList.toggle('four',word.length===4);board.classList.toggle('win',won);board.replaceChildren();
[...word].forEach((letter,index)=>{const b=document.createElement('button');b.className='tile';b.textContent=letter;b.setAttribute('aria-label',`Letter ${index+1}: ${letter}`);b.setAttribute('aria-pressed',String(selected===index));b.disabled=won;b.onclick=()=>{selected=index;render(`Choose a letter to replace ${letter}.`)};board.append(b)});
bank.hidden=won;bank.classList.toggle('five',level.letters.length===5);bank.replaceChildren();[...level.letters].forEach(letter=>{const b=document.createElement('button');b.className='letter';b.textContent=letter;b.setAttribute('aria-label',`Use ${letter}`);b.onclick=()=>{if(selected===null){message.textContent='First, tap the tile you want to change.';return}const next=[...word];next[selected]=letter;const candidate=next.join('');if(candidate===word){message.textContent='Choose a different letter.';return}if(!level.words.split(' ').includes(candidate)){message.textContent=`${candidate} isn’t in this little word set. Try another letter.`;return}history.push(candidate);selected=null;render()};bank.append(b)});
path.replaceChildren();history.forEach((w,i)=>{if(i)path.append(' → ');const span=document.createElement(i===history.length-1?'strong':'span');span.textContent=w;path.append(span)});
message.textContent=won?`${levelIndex===2?'All three complete!':'Level complete!'} ${history.length-1} moves.`:note||'Tap a tile, then choose a new letter.';
$('#undo').disabled=history.length===1;$('#during').hidden=won;$('.finish').hidden=!won;$('#next').hidden=levelIndex===2;
}
$('#play').onclick=()=>start(0);$('#next').onclick=()=>start(levelIndex+1);$('#again').onclick=()=>start(levelIndex);$('#quit').onclick=quit;$('#finish-quit').onclick=quit;
$('#undo').onclick=()=>{if(history.length>1)history.pop();selected=null;render()};$('#restart').onclick=()=>start(levelIndex);
</script></body></html>
